<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;color:#4A5A53}
.track{width:100%;height:96px;border-radius:10px;background:#E1E8E4;display:flex;align-items:flex-end;overflow:hidden}
.fill{width:100%;background:#0A6B52;border-radius:10px}
.pm{display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-bottom:1px solid #E1E8E4}
.pm:last-child{border-bottom:0}
.pmTop{display:flex;justify-content:space-between;align-items:baseline;font-size:19px}
.bar{height:10px;border-radius:5px;background:#E1E8E4;overflow:hidden}
.bar span{display:block;height:100%;background:#0A6B52;border-radius:5px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:#4A5A53;min-height:56px;justify-content:center;text-decoration:none}
.tab.on{color:#0A6B52;font-weight:600}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EEF3F0;font-family:'Readex Pro',sans-serif;color:#10231D;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;overflow:hidden;padding:20px 16px 12px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:flex-start;justify-content:space-between">
<h1 style="margin:0;font-size:32px;font-weight:700;line-height:1.2">Progress</h1>
<button style="min-height:48px;padding:0 16px;border-radius:999px;border:2px solid #0A6B52;background:#fff;color:#0A6B52;font:600 17px 'Readex Pro',sans-serif">العربية</button>
</div>

<div role="group" aria-label="Period" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#DDE6E1;border-radius:16px;padding:4px">
<button aria-pressed="true" style="min-height:48px;border:0;border-radius:12px;background:#fff;color:#10231D;font:600 18px 'Readex Pro',sans-serif">Last 7 days</button>
<button aria-pressed="false" style="min-height:48px;border:0;border-radius:12px;background:transparent;color:#4A5A53;font:500 18px 'Readex Pro',sans-serif">Last 30 days</button>
</div>

<section style="background:#fff;border-radius:24px;border:1px solid #E1E8E4;padding:18px 16px;display:flex;flex-direction:column;gap:14px">
<p style="margin:0;font-size:20px;line-height:1.4">You took <strong>40 of 48</strong> doses this week.</p>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px" aria-label="Doses taken each day">
<div class="day"><div class="track"><div class="fill" style="height:100%"></div></div>Sat</div>
<div class="day"><div class="track"><div class="fill" style="height:86%"></div></div>Sun</div>
<div class="day"><div class="track"><div class="fill" style="height:71%"></div></div>Mon</div>
<div class="day"><div class="track"><div class="fill" style="height:100%"></div></div>Tue</div>
<div class="day"><div class="track"><div class="fill" style="height:86%"></div></div>Wed</div>
<div class="day"><div class="track"><div class="fill" style="height:86%"></div></div>Thu</div>
<div class="day" style="color:#10231D;font-weight:600"><div class="track"><div class="fill" style="height:57%"></div></div>Today</div>
</div>
</section>

<div style="background:#fff;border-radius:20px;border:1px solid #E1E8E4;overflow:hidden">
<div class="pm"><div class="pmTop"><span>Concor 5 mg</span><strong>100%</strong></div><div class="bar"><span style="width:100%"></span></div></div>
<div class="pm"><div class="pmTop"><span>Glucophage 500 mg</span><strong>79%</strong></div><div class="bar"><span style="width:79%"></span></div></div>
<div class="pm"><div class="pmTop"><span>Nexium 40 mg</span><strong>71%</strong></div><div class="bar"><span style="width:71%"></span></div></div>
</div>

<button style="min-height:56px;border-radius:16px;border:2px solid #0A6B52;background:#fff;color:#0A6B52;font:600 19px 'Readex Pro',sans-serif">See every dose</button>
</div>
