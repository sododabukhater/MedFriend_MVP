<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
h2{margin:0 4px 6px;font-size:18px;font-weight:600;color:#4A5A53}
.grp{background:#fff;border-radius:20px;border:1px solid #E1E8E4;overflow:hidden}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:56px;border-bottom:1px solid #E1E8E4;font-size:19px}
.it:last-child{border-bottom:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:#4A5A53;min-height:56px;justify-content:center;text-decoration:none}
.tab.on{color:#0A6B52;font-weight:600}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EEF3F0;font-family:'Readex Pro',sans-serif;color:#10231D;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;overflow:hidden;padding:20px 16px 12px;display:flex;flex-direction:column;gap:18px">
<h1 style="margin:0;font-size:32px;font-weight:700;line-height:1.2">Settings</h1>

<section>
<h2>Language</h2>
<div role="group" aria-label="Language" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#DDE6E1;border-radius:16px;padding:4px">
<button aria-pressed="false" style="min-height:48px;border:0;border-radius:12px;background:transparent;color:#4A5A53;font:500 19px 'Readex Pro',sans-serif">العربية</button>
<button aria-pressed="true" style="min-height:48px;border:0;border-radius:12px;background:#fff;color:#10231D;font:600 19px 'Readex Pro',sans-serif">English</button>
</div>
</section>

<section>
<h2>For the demo</h2>
<div class="grp">
<div class="it"><span>Demo speed<br><small style="font-size:16px;color:#4A5A53">1 minute becomes 1 second</small></span>
<button role="switch" aria-checked="true" aria-label="Demo speed" style="width:64px;height:36px;border-radius:18px;border:0;background:#0A6B52;position:relative;flex-shrink:0"><span style="position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;border-radius:50%;background:#fff"></span></button></div>
<div class="it" style="padding:12px"><button style="width:100%;min-height:52px;border-radius:14px;border:2px solid #0A6B52;background:#fff;color:#0A6B52;font:600 18px 'Readex Pro',sans-serif">Show the next reminder now</button></div>
</div>
</section>

<section>
<h2>Account</h2>
<div class="grp">
<div class="it"><span style="font-size:18px">demo@medfriend.jo</span></div>
<div class="it" style="padding:12px"><button style="width:100%;min-height:52px;border-radius:14px;border:2px solid #10231D33;background:#fff;color:#10231D;font:500 18px 'Readex Pro',sans-serif">Log out</button></div>
<div class="it" style="padding:12px"><button style="width:100%;min-height:52px;border-radius:14px;border:2px solid #9B1C1C;background:#fff;color:#9B1C1C;font:600 18px 'Readex Pro',sans-serif">Reset all data</button></div>
</div>
</section>

<p style="margin:0 4px;font-size:16px;line-height:1.5;color:#4A5A53">Med Friend only records what you enter. It does not give medical advice.</p>
</div>
